      "mainEntity": [
        {
          "@type": "Question",
          "name": "هل التجربة المجانية بتحتاج كارت ائتمان؟",

          "@type": "Question",
          "name": "هل أقدر أغير الباقة بعدين؟",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "في أي وقت. ترقّى أو نزّل — والفرق بيتحسب تلقائياً."
