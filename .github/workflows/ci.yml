name: CI

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 10
  # Node 22 is the current LTS. The codebase still targets 20 at runtime
  # (Dockerfile FROM node:20-alpine) — the CI runtime drives type-check
  # only, so bumping here is safe and gets us off Node 20 before GitHub's
  # June 2026 forced-migration deadline. Bump the Dockerfile separately
  # when ready to validate the production runtime.
  NODE_VERSION: 22

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm db:generate
        env:
          DATABASE_MASTER_URL: postgresql://postgres:password@localhost:5432/hesba_master

      - name: Type-check API
        run: pnpm --filter @hesba/api type-check

      - name: Type-check Web
        run: pnpm --filter @hesba/web type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint must pass — `|| true` previously silenced this gate, which meant
      # nothing automated could catch a regression once tests aren't required.
      - run: pnpm lint

  test:
    name: Test (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm db:generate
        env:
          DATABASE_MASTER_URL: postgresql://postgres:password@localhost:5432/hesba_master

      - name: Run API unit tests
        run: pnpm --filter @hesba/api test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm db:generate
        env:
          DATABASE_MASTER_URL: postgresql://postgres:password@localhost:5432/hesba_master

      - name: Build Web
        run: pnpm --filter @hesba/web build

      - name: Build API
        run: pnpm --filter @hesba/api build
